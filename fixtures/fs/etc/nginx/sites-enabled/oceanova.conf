server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
}

server {
    listen 443 ssl http2;
    server_name oceanova.example.com api.oceanova.example.com;
    root /var/www/oceanova/public;

    ssl_certificate     /etc/letsencrypt/live/oceanova.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oceanova.example.com/privkey.pem;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-oceanova.sock;
        include fastcgi_params;
    }
}
