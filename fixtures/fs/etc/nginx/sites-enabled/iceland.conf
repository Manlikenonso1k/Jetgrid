server {
    listen 80;
    server_name iceland.example.com www.iceland.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name iceland.example.com;
    root /var/www/iceland/public;

    ssl_certificate     /etc/letsencrypt/live/iceland.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iceland.example.com/privkey.pem;

    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-iceland.sock;
        include fastcgi_params;
    }
}
