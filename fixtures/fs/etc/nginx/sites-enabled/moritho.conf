server {
    listen 443 ssl http2;
    server_name moritho.example.com;
    root /var/www/moritho/current/public;

    ssl_certificate     /etc/letsencrypt/live/moritho.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moritho.example.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-moritho.sock;
        include fastcgi_params;
    }
}
