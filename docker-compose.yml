# Local development for JetGrid.
#
# This stack FAKES the server layer: the app container runs with
# JETGRID_DRIVER=fake, so discovery and monitoring read the fixtures in
# the fixtures/ directory instead of a real machine, and FakeServerDriver
# cannot execute anything at all. You can build and exercise the whole UI —
# including the 3D dashboard — without a real box, and without any possibility
# of reaching one.
#
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
#   docker compose exec app php artisan jetgrid:discover
#   open http://localhost:8080/admin

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      # Safety defaults are the same here as in production. Development is not
      # a reason to practise unsafe habits.
      JETGRID_READONLY: "true"
      JETGRID_DRY_RUN_DEFAULT: "true"

      # The whole point of this stack: no real server behind it.
      JETGRID_DRIVER: fake

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: jetgrid
      DB_USERNAME: jetgrid
      DB_PASSWORD: jetgrid

      # Redis exists in this stack, so use it. On a small production instance it
      # very often does not — JetGrid falls back to the database driver rather
      # than installing Redis.
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: jetgrid
      MARIADB_USER: jetgrid
      MARIADB_PASSWORD: jetgrid
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - jetgrid-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63791:6379"

volumes:
  jetgrid-db:
